<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title description">
  <title id="title">StackRadar AI-powered job search workflow</title>
  <desc id="description">A three-stage workflow covering job data collection and enrichment, role screening, and tailored cover-letter generation.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef5ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e3a5f" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c93b5"/>
    </marker>
    <style>
      .title { font: 700 42px Inter, Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 22px Inter, Arial, sans-serif; fill: #667085; }
      .stage-number { font: 700 20px Inter, Arial, sans-serif; fill: #ffffff; }
      .stage-title { font: 700 25px Inter, Arial, sans-serif; fill: #172033; }
      .node-title { font: 700 22px Inter, Arial, sans-serif; fill: #27364d; }
      .node-copy { font: 400 18px Inter, Arial, sans-serif; fill: #667085; }
      .output-title { font: 700 22px Inter, Arial, sans-serif; fill: #1746a2; }
      .manual-title { font: 700 22px Inter, Arial, sans-serif; fill: #a4450a; }
      .arrow { fill: none; stroke: #7c93b5; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="1040" fill="url(#background)"/>
  <text x="90" y="78" class="title">StackRadar System Workflow</text>
  <text x="90" y="116" class="subtitle">From daily job collection to screened opportunities and tailored applications</text>

  <!-- Stage 1 -->
  <rect x="70" y="160" width="1660" height="240" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="118" cy="210" r="25" fill="#2563eb"/>
  <text x="118" y="217" text-anchor="middle" class="stage-number">1</text>
  <text x="158" y="218" class="stage-title">Job Data Collection and Enrichment</text>

  <rect x="110" y="260" width="330" height="100" rx="18" fill="#eff6ff" stroke="#93b7f8" stroke-width="2"/>
  <text x="275" y="300" text-anchor="middle" class="node-title">Collect new SEEK roles</text>
  <text x="275" y="330" text-anchor="middle" class="node-copy">Automatically, every day</text>

  <path d="M 440 310 L 515 310" class="arrow"/>
  <rect x="520" y="260" width="300" height="100" rx="18" fill="#eff6ff" stroke="#93b7f8" stroke-width="2"/>
  <text x="670" y="300" text-anchor="middle" class="node-title">Prepare job data</text>
  <text x="670" y="330" text-anchor="middle" class="node-copy">Clean and normalise</text>

  <path d="M 820 310 L 895 310" class="arrow"/>
  <rect x="900" y="245" width="380" height="130" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="1090" y="288" text-anchor="middle" class="node-title">LLM job enrichment</text>
  <text x="1090" y="320" text-anchor="middle" class="node-copy">Skills · Experience requirements</text>
  <text x="1090" y="346" text-anchor="middle" class="node-copy">Seniority signals</text>

  <path d="M 1280 310 L 1355 310" class="arrow"/>
  <rect x="1360" y="260" width="320" height="100" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="1520" y="301" text-anchor="middle" class="output-title">Technology-demand</text>
  <text x="1520" y="330" text-anchor="middle" class="output-title">insights</text>

  <!-- Stage connection -->
  <path d="M 900 400 L 900 445" class="arrow"/>

  <!-- Stage 2 -->
  <rect x="70" y="450" width="1660" height="240" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="118" cy="500" r="25" fill="#2563eb"/>
  <text x="118" y="507" text-anchor="middle" class="stage-number">2</text>
  <text x="158" y="508" class="stage-title">Automated Role Screening</text>

  <rect x="110" y="550" width="300" height="100" rx="18" fill="#eff6ff" stroke="#93b7f8" stroke-width="2"/>
  <text x="260" y="590" text-anchor="middle" class="node-title">Filter Junior roles</text>
  <text x="260" y="620" text-anchor="middle" class="node-copy">From newly collected jobs</text>

  <path d="M 410 600 L 485 600" class="arrow"/>
  <rect x="490" y="535" width="420" height="130" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="700" y="578" text-anchor="middle" class="node-title">LLM role-fit assessment</text>
  <text x="700" y="610" text-anchor="middle" class="node-copy">Compare with predefined</text>
  <text x="700" y="636" text-anchor="middle" class="node-copy">career directions</text>

  <path d="M 910 600 L 985 600" class="arrow"/>
  <rect x="990" y="550" width="330" height="100" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="1155" y="590" text-anchor="middle" class="output-title">Add matched roles</text>
  <text x="1155" y="620" text-anchor="middle" class="node-copy">to Google Sheets</text>

  <path d="M 1320 600 L 1395 600" class="arrow"/>
  <rect x="1400" y="550" width="280" height="100" rx="18" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
  <text x="1540" y="591" text-anchor="middle" class="manual-title">Manual review</text>
  <text x="1540" y="621" text-anchor="middle" class="node-copy">Select a role to pursue</text>

  <!-- Stage connection -->
  <path d="M 900 690 L 900 735" class="arrow"/>

  <!-- Stage 3 -->
  <rect x="70" y="740" width="1660" height="240" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <circle cx="118" cy="790" r="25" fill="#2563eb"/>
  <text x="118" y="797" text-anchor="middle" class="stage-number">3</text>
  <text x="158" y="798" class="stage-title">Tailored Cover-Letter Generation</text>

  <rect x="110" y="825" width="470" height="120" rx="18" fill="#eff6ff" stroke="#93b7f8" stroke-width="2"/>
  <text x="345" y="865" text-anchor="middle" class="node-title">Build grounded context</text>
  <text x="345" y="897" text-anchor="middle" class="node-copy">Selected role · Uploaded CV · Verified evidence</text>
  <text x="345" y="923" text-anchor="middle" class="node-copy">Optional role-specific research</text>

  <path d="M 580 885 L 675 885" class="arrow"/>
  <rect x="680" y="825" width="400" height="120" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="880" y="875" text-anchor="middle" class="node-title">Generate and validate</text>
  <text x="880" y="907" text-anchor="middle" class="node-copy">Automatically revise when needed</text>

  <path d="M 1080 885 L 1175 885" class="arrow"/>
  <rect x="1180" y="825" width="500" height="120" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text x="1430" y="875" text-anchor="middle" class="output-title">Preview the tailored cover letter</text>
  <text x="1430" y="907" text-anchor="middle" class="node-copy">Download the application-ready DOCX</text>
</svg>
